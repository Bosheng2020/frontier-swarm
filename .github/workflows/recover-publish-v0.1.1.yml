name: Recover Frontier Swarm v0.1.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover verified source and publish
        shell: bash
        run: |
          awk '
            $0 == "          PAYLOAD: >-" { capture = 1; next }
            $0 == "        run: |" { capture = 0 }
            capture { sub(/^            /, ""); printf "%s", $0 }
          ' .github/workflows/publish-v0.1.1.yml | base64 -d > /tmp/frontier-swarm-v0.1.1.tar.gz
          echo '5f0e49831d886cc7005dc70c1233950efc8eeb3bbdcafadf5edeb58395b0548b  /tmp/frontier-swarm-v0.1.1.tar.gz' | sha256sum --check -
          tar -xzf /tmp/frontier-swarm-v0.1.1.tar.gz
          rm -f .github/workflows/publish-v0.1.1.yml
          rm -f .github/workflows/recover-publish-v0.1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add credential-free orchestration walkthrough"
          git push origin HEAD:main
