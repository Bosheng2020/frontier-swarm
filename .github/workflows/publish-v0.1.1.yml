name: Publish Frontier Swarm v0.1.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified v0.1.1 source
        shell: bash
        env:
          PAYLOAD: >-
            
        run: |
          printf %s "$PAYLOAD" | base64 -d | tar -xz
          rm -f .github/workflows/publish-v0.1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add credential-free orchestration walkthrough"
          git push origin HEAD:main
