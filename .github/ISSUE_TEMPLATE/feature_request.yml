name: Feature request
description: Propose a scoped capability, safety control, or developer-experience improvement.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the implementation. Frontier Swarm is a preview reference project, so proposals should include cost, safety, and evaluation considerations.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues, discussions, and pull requests.
          required: true
        - label: This request does not rely on an unsupported SOTA or production-readiness claim.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, in what workflow, and why do current capabilities not solve it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior and acceptance criteria rather than only an API shape.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Planner
        - Analyst / Researcher / Builder
        - Critic / Verifier
        - Synthesizer
        - Orchestration runtime
        - Evaluation and benchmarks
        - Security and approvals
        - Documentation and developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include a simpler single-agent, prompt-only, or configuration-based alternative where relevant.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Cost and performance impact
      description: Estimate changes to model calls, tokens, wall time, concurrency, storage, and provider cost.
      placeholder: Expected impact and how it should be bounded or measured.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Security, privacy, and human-oversight impact
      description: Identify new data flows, tools, permissions, external side effects, or approval requirements.
    validations:
      required: true

  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation plan
      description: What deterministic tests or opt-in evals would demonstrate the feature works without overstating the result?
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or evaluate this feature.
